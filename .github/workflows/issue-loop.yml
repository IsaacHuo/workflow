name: issue loop

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: issue-loop
  cancel-in-progress: false

env:
  DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  triage:
    if: vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: bot
        uses: ./.github/actions/bot-setup
        with:
          app-id: ${{ vars.WF_APP_ID }}
          private-key: ${{ secrets.WF_APP_PRIVATE_KEY }}
      - run: python -m wf.loops.issue_triage
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_LOGIN: ${{ steps.bot.outputs.bot-login }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

  alert:
    needs: [triage]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: bot
        uses: ./.github/actions/bot-setup
        with:
          app-id: ${{ vars.WF_APP_ID }}
          private-key: ${{ secrets.WF_APP_PRIVATE_KEY }}
      - run: python -m wf.loops.alert --workflow "$WORKFLOW"
        env:
          DRY_RUN: "false"   # 告警总是真实发出
          WORKFLOW: ${{ github.workflow }}
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_LOGIN: ${{ steps.bot.outputs.bot-login }}
